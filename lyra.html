<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYRA - Next Gen AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --glass: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --cyan: #06b6d4;
            --text: #f3f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .glow { position: absolute; width: 350px; height: 350px; background: var(--accent); filter: blur(140px); border-radius: 50%; z-index: -1; top: 10%; left: 20%; opacity: 0.5; }
        .glow-2 { top: 60%; left: 60%; background: var(--cyan); }

        .container {
            width: 90%; max-width: 900px; height: 85vh;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px var(--accent-glow); }
        .status { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #9ca3af; }
        .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

        .chat-box { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        
        .msg { max-width: 75%; padding: 14px 20px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; animation: fadeIn 0.3s ease-in-out; white-space: pre-wrap; }
        .user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), #6366f1); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px var(--accent-glow); }
        .bot { align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #e5e7eb; border-bottom-left-radius: 4px; }

        .input-area { padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; background: rgba(0,0,0,0.2); }
        input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 14px 20px; border-radius: 14px; color: #fff; outline: none; font-size: 0.95rem; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        button { background: linear-gradient(135deg, var(--accent), var(--cyan)); border: none; padding: 0 25px; border-radius: 14px; color: #fff; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="glow-2"></div>

    <div class="container">
        <header>
            <div class="logo">LYRA</div>
            <div class="status"><span class="dot"></span> CREATED BY TAHA MUJTABA</div>
        </header>

        <div class="chat-box" id="chatBox">
            <div class="msg bot">Hello! I am <b>LYRA</b>, your next-gen AI assistant. How can I help you today?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask Lyra anything..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        async function sendMsg() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('chatBox');
            const text = input.value.trim();

            if(!text) return;

            box.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            const loaderId = 'loader-' + Date.now();
            box.innerHTML += `<div class="msg bot" id="${loaderId}">Lyra is processing...</div>`;
            box.scrollTop = box.scrollHeight;

            try {
                // Free Public Inference Endpoint (No Login / No API Key required)
                const res = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: 'Your name is Lyra, a very futuristic, modern, polite and super intelligent AI assistant,your OWNER,CREATOR,FOUNDER is TAHA MUJTABA.TAHA MUJTABA OFFICIAL WEB (https://itaha.duckdns.org/).' },
                            { role: 'user', content: text }
                        ],
                        model: 'openai'
                    })
                });

                const replyText = await res.text();
                document.getElementById(loaderId).innerText = replyText;
            } catch (err) {
                document.getElementById(loaderId).innerText = "Lyra encountered a connection issue. Please try again.";
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"e3c1c9af36de41759418005494a48906","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
