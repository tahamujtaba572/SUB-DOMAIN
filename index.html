<style>

  body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh}

  .bg-blobs{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55;animation:float 14s ease-in-out infinite}
  .b1{width:500px;height:500px;background:#7c5cff;top:-100px;left:-100px}
  .b2{width:450px;height:450px;background:#00e0ff;bottom:-120px;right:-80px;animation-delay:-4s}
  .b3{width:380px;height:380px;background:#ff4ecb;top:40%;left:45%;animation-delay:-8s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.15)}}

  .navbar{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;
    padding:16px 6%;backdrop-filter:blur(18px);background:rgba(10,10,20,.55);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:1px}
  .logo{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);box-shadow:0 0 18px rgba(124,92,255,.6)}
  .navbar nav{display:flex;gap:26px}
  .navbar nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;transition:.3s}
  .navbar nav a:hover{color:var(--accent2)}

  .hero{display:grid;grid-template-columns:340px 1fr;gap:60px;align-items:center;padding:80px 8%;min-height:82vh}
  .hero-img-wrap{position:relative;width:300px;height:300px}
  .hero-img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid rgba(255,255,255,.1);
    box-shadow:0 0 60px rgba(124,92,255,.5);animation:pulse 4s ease-in-out infinite}
  .ring{position:absolute;inset:-18px;border-radius:50%;border:3px dashed rgba(0,224,255,.6);animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 60px rgba(124,92,255,.5)}50%{box-shadow:0 0 90px rgba(0,224,255,.7)}}

  .greet{color:var(--accent2);font-weight:600;margin-bottom:12px;letter-spacing:1px}
  h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:900;line-height:1.05;
    background:linear-gradient(90deg,#fff,#7c5cff,#00e0ff,#fff);background-size:300% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
  @keyframes shine{to{background-position:300% center}}
  .tagline{font-size:1.25rem;font-weight:600;color:var(--accent2);margin:18px 0}
  .desc{color:var(--muted);line-height:1.8;max-width:620px;font-size:1.02rem}

  .buttons{display:flex;flex-wrap:wrap;gap:16px;margin-top:36px}
  .btn{position:relative;display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:50px;
    font-weight:700;font-size:15px;text-decoration:none;color:#fff;
    background:linear-gradient(135deg,#7c5cff,#00e0ff);box-shadow:0 10px 30px rgba(124,92,255,.45);
    transition:all .35s ease;overflow:hidden;border:none;cursor:pointer}
  .btn::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#00e0ff,#7c5cff);opacity:0;transition:.35s}
  .btn span{position:relative;z-index:1}
  .btn:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 16px 40px rgba(0,224,255,.6)}
  .btn:hover::before{opacity:1}
  .btn.outline{background:transparent;border:2px solid var(--border);box-shadow:none}
  .btn.outline:hover{border-color:var(--accent2)}

  .skills-section{padding:60px 8% 80px}
  .section-title{font-size:1.8rem;margin-bottom:34px;font-weight:800}
  .skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px}
  .skill-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;
    backdrop-filter:blur(12px);transition:.35s;position:relative;overflow:hidden}
  .skill-card::after{content:"";position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(0,224,255,.15));opacity:0;transition:.35s}
  .skill-card:hover{transform:translateY(-6px);border-color:rgba(0,224,255,.5)}
  .skill-card:hover::after{opacity:1}
  .skill-name{font-size:1.15rem;font-weight:800;margin-bottom:6px;position:relative;z-index:1}

  footer{border-top:1px solid var(--border);background:rgba(10,10,20,.7);padding:40px 8% 30px;text-align:center}

<script>
document.getElementById('year').textContent = new Date().getFullYear();

async function loadData(){
  try{
    const res = await fetch('data.json');
    const data = await res.json();

    document.getElementById('name').textContent = data.name;
    document.getElementById('navName').textContent = data.name;
    document.title = data.name + ' — Developer';
    document.getElementById('tagline').textContent = data.tagline;
    document.getElementById('description').textContent = data.description;

    const btnWrap = document.getElementById('buttons');
    btnWrap.innerHTML = '';
    data.links.forEach(function(link, i){
      const a = document.createElement('a');
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'btn' + (i % 2 === 1 ? ' outline' : '');
      a.innerHTML = '<span>' + (link.icon || '') + ' ' + link.label + '</span>';
      btnWrap.appendChild(a);
    });

    const skillsWrap = document.getElementById('skills');
    skillsWrap.innerHTML = '';
    data.skills.forEach(function(s){
      const div = document.createElement('div');
      div.className = 'skill-card';
      div.innerHTML = '<div class="skill-name">' + s.name + '</div><div class="skill-level">' + s.level + '</div>';
      skillsWrap.appendChild(div);
    });
  }catch(err){
    console.error('Failed to load data.json:', err);
